name: Build C64-EmuDis Android

on:
  push:
    branches: [ main, android ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - 'packaging/android/**'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (arm64 + x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake flex bison xa65 dos2unix ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Cache SDL builds
        uses: actions/cache@v4
        with:
          path: |
            _android/prefix-*
            _android/SDL2
            _android/SDL2_image
          key: android-sdl-${{ hashFiles('packaging/android/build-native.sh') }}

      - name: Build native libraries
        run: |
          set -o pipefail
          ./autogen.sh
          packaging/android/build-native.sh . _android 2>&1 | tee android-native.log

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EMUDIS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "release key: yes"
          else
            echo "release key: no (debug signed)"
          fi

      - name: Build APK
        env:
          EMUDIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EMUDIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMUDIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          gradle --no-daemon assembleRelease 2>&1 | tee ../android-gradle.log
          VERSION=$(sed -n 's/^#define EMUDIS_VERSION *"\(.*\)"/\1/p' ../src/emudis_version.h)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/C64-EmuDis-$VERSION-android.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-android
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            android-*.log
            _android/vice-build-*/config.log

  # start the APK in an Android emulator (ARM code runs via the emulator's
  # ARM translation), take screenshots in portrait and landscape and with the
  # keyboard overlay; the screenshots are printed base64 encoded into the log
  smoke-test:
    name: Android smoke test
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C64-EmuDis-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash packaging/android/smoke-test.sh apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-test
          path: smoke/
