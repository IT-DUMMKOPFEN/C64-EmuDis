name: Build C64-EmuDis

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFIGURE_FLAGS: --enable-gtk3ui --disable-arch --disable-pdf-docs --disable-html-docs

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake flex bison xa65 dos2unix \
            libgtk-3-dev libglew-dev libpulse-dev libasound2-dev libpng-dev \
            libcurl4-openssl-dev libevdev-dev zlib1g-dev

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(nproc) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          ../packaging/linux/make-dist.sh .. . ../dist 2>&1 | tee -a ../ci-build.log

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE "error|Error|ERROR|No such file|not found|cannot" ci-build.log | tail -n 40 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-linux-x86_64
          path: dist/*.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel autotools git zip unzip dos2unix flex bison libiconv
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-icoutils
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Install xa65
        run: |
          if ! pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-xa65; then
            git clone --depth 1 https://github.com/fachat/xa65.git /tmp/xa65
            make -C /tmp/xa65/xa xa CC=gcc
            cp /tmp/xa65/xa/xa.exe /ucrt64/bin/xa.exe
          fi
          xa --version | head -1
          command -v iconv || pacman -S --noconfirm --needed iconv || true
          command -v iconv

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(nproc) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          set -o pipefail
          ../packaging/windows/make-dist.sh .. ../dist 2>&1 | tee -a ../ci-build.log

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE "error|Error|ERROR|No such file|not found|cannot" ci-build.log | tail -n 40 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-windows-x64
          path: dist/*.zip

  macos:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake pkg-config gtk+3 glew xa dos2unix libpng \
            adwaita-icon-theme hicolor-icon-theme librsvg ffmpeg

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(sysctl -n hw.ncpu) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          set -o pipefail
          DEPS_PREFIX="$(brew --prefix)" ../packaging/macos/make-dist.sh .. strip zip 2>&1 | tee -a ../ci-build.log
          mkdir -p ../dist && mv *.dmg ../dist/

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE "error|Error|ERROR|No such file|not found|cannot" ci-build.log | tail -n 40 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-macos-arm64
          path: dist/*.dmg

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: true
          generate_release_notes: true
