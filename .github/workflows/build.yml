name: Build C64-EmuDis

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v0.1a), empty = no release'
        required: false
        default: ''

permissions:
  contents: write

env:
  CONFIGURE_FLAGS: --enable-gtk3ui --disable-arch --disable-pdf-docs --disable-html-docs

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake flex bison xa65 dos2unix \
            libgtk-3-dev libglew-dev libpulse-dev libasound2-dev libpng-dev \
            libcurl4-openssl-dev libevdev-dev zlib1g-dev

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(nproc) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          ../packaging/linux/make-dist.sh .. . ../dist 2>&1 | tee -a ../ci-build.log

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE -A4 ": (fatal )?error:|undefined reference|\] Error [0-9]|configure: error|No such file" ci-build.log | cut -c1-400 | head -n 60 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-linux-x86_64
          path: dist/*.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel autotools git zip unzip dos2unix flex bison libiconv
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-icoutils
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Install xa65
        run: |
          if ! pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-xa65; then
            git clone --depth 1 https://github.com/fachat/xa65.git /tmp/xa65
            make -C /tmp/xa65/xa xa CC=gcc
            cp /tmp/xa65/xa/xa.exe /ucrt64/bin/xa.exe
          fi
          xa --version | head -1
          command -v iconv || pacman -S --noconfirm --needed iconv || true
          command -v iconv

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(nproc) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          set -o pipefail
          ../packaging/windows/make-dist.sh .. ../dist 2>&1 | tee -a ../ci-build.log

      - name: Smoke test (start the packaged emulator)
        continue-on-error: true
        run: |
          D=$(ls -d dist/C64-EmuDis-*-windows-x64 | head -1)
          W=$(cygpath -w "$PWD")
          (timeout 150 "$D/bin/C64-EmuDis.exe" -default -sounddev dummy -limitcycles 4000000 \
              -exitscreenshot "$W\\smoke-win.png" -logfile "$W\\smoke-win.log"; echo "exit code $?") \
              > smoke-win-stdout.log 2>&1 || true
          cat smoke-win-stdout.log
          ls "$D/bin" | head -50 > smoke-win-files.log
          ls "$D" >> smoke-win-files.log

      - name: Smoke test report
        if: always()
        shell: bash
        run: |
          for f in smoke-*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 70 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=$f::$msg"
          done
          ls -la smoke-* 2>/dev/null | sed 's/^/smoke: /' || echo "smoke: no files"

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE -A4 ": (fatal )?error:|undefined reference|\] Error [0-9]|configure: error|No such file" ci-build.log | cut -c1-400 | head -n 60 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-windows-x64
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-windows
          path: smoke-*

  macos:
    name: macOS arm64 (Apple Silicon)
    # macOS minutes are expensive on private repos: build only for releases
    # (tags v*) or when started manually (Actions -> Run workflow)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          : > ci-build.log
          brew --version | tee -a ci-build.log
          # make sure the Python the formulas depend on is really installed
          for py in python@3.15 python@3.14 python@3.13; do
            brew list "$py" >/dev/null 2>&1 && { brew reinstall "$py" >> ci-build.log 2>&1 || true; }
          done
          brew install python@3.15 >> ci-build.log 2>&1 || true
          pkgs="autoconf automake libtool pkgconf gtk+3 glew dos2unix libpng
                adwaita-icon-theme hicolor-icon-theme librsvg ffmpeg"
          failed=""
          for f in $pkgs; do
            echo "### brew install $f" >> ci-build.log
            brew install "$f" >> ci-build.log 2>&1 || failed="$failed $f"
          done
          if [ -n "$failed" ]; then
            still=""
            for f in $failed; do
              echo "### retry $f" >> ci-build.log
              brew install "$f" >> ci-build.log 2>&1 || still="$still $f"
            done
            failed="$still"
          fi
          echo "brew failures:$failed" | tee -a ci-build.log
          if ! command -v xa >/dev/null; then
            brew install xa || {
              git clone --depth 1 https://github.com/fachat/xa65.git /tmp/xa65
              make -C /tmp/xa65/xa xa CC=clang
              sudo cp /tmp/xa65/xa/xa /usr/local/bin/xa
            }
          fi
          xa --version | head -1
          for t in autoconf automake pkg-config glib-compile-schemas gdk-pixbuf-query-loaders ffmpeg; do
            command -v $t || { echo "missing tool: $t" | tee -a ci-build.log; exit 1; }
          done
          pkg-config --modversion gtk+-3.0 glew

      - name: Build
        run: |
          set -o pipefail
          ./autogen.sh 2>&1 | tee ci-build.log
          mkdir _build && cd _build
          ../configure $CONFIGURE_FLAGS 2>&1 | tee -a ../ci-build.log
          make -j$(sysctl -n hw.ncpu) 2>&1 | tee -a ../ci-build.log

      - name: Package
        run: |
          cd _build
          set -o pipefail
          DEPS_PREFIX="$(brew --prefix)" ../packaging/macos/make-dist.sh .. strip zip 2>&1 | tee -a ../ci-build.log
          mkdir -p ../dist && mv *.dmg ../dist/

      - name: Smoke test (start the packaged emulator)
        continue-on-error: true
        run: |
          APP=$(ls -d _build/C64-EmuDis-*-macos-*/C64-EmuDis.app | head -1)
          echo "app: $APP"
          du -sh "$APP" > smoke-mac-files.log
          ls "$APP/Contents/Resources/bin" "$APP/Contents/Resources/lib" | head -80 >> smoke-mac-files.log
          otool -L "$APP/Contents/Resources/bin/x64sc" >> smoke-mac-files.log
          perl -e 'alarm 150; exec @ARGV' "$APP/Contents/MacOS/C64-EmuDis" -default -sounddev dummy \
              -limitcycles 4000000 -exitscreenshot "$PWD/smoke-mac.png" -logfile "$PWD/smoke-mac.log" \
              > smoke-mac-stdout.log 2>&1; echo "exit code $?" >> smoke-mac-stdout.log
          cat smoke-mac-stdout.log

      - name: Smoke test report
        if: always()
        shell: bash
        run: |
          for f in smoke-*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 70 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=$f::$msg"
          done
          ls -la smoke-* 2>/dev/null | sed 's/^/smoke: /' || echo "smoke: no files"

      - name: Report build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f ci-build.log ]; then
            grep -nE -A4 ": (fatal )?error:|undefined reference|\] Error [0-9]|configure: error|No such file" ci-build.log | cut -c1-400 | head -n 60 > ci-errors.txt || true
            tail -n 60 ci-build.log > ci-tail.txt
            for f in ci-errors.txt ci-tail.txt; do
              msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
          fi
          if [ -f _build/config.log ]; then
            msg=$(tail -n 40 _build/config.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=config.log::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: C64-EmuDis-macos-arm64
          path: dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-macos
          path: smoke-*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: C64-EmuDis ${{ inputs.release_tag || github.ref_name }}
          body: |
            **C64-EmuDis** - a Commodore 64 emulator based on VICE 3.10 with memory analysis tools
            (live memory viewer, font/sprite/SID finder, assembler, disassembler, snapshot manager,
            screenshots and MP4 video recording 1x-4x). No loading times by default.

            | Platform | File | How to start |
            |----------|------|--------------|
            | Windows 10/11 (x64) | `C64-EmuDis-*-windows-x64.zip` | unzip, run `bin\C64-EmuDis.exe`. SmartScreen: "More info" -> "Run anyway" |
            | macOS 12+ (Apple Silicon) | `C64-EmuDis-*-macos-arm64.dmg` | drag to Applications, first start: right-click -> Open (not notarized) |
            | Linux (x86_64) | `C64-EmuDis-*-linux-x86_64.tar.gz` | extract, run `./C64-EmuDis` (needs GTK 3, GLEW, ffmpeg) |

            Author: IT-Dummkopfen - License: GPL-2.0-or-later (based on VICE).
            This is an alpha version - feedback welcome!
